name: Pylint

on:
  pull_request:
    paths:
      - '*.py'

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt install --fix-missing libsdl1.2-dev 
          sudo apt-get install git python3-dev python3-setuptools python3-numpy python3-opengl \
          libsdl-image1.2-dev libsdl-mixer1.2-dev libsdl-ttf2.0-dev libsmpeg-dev \
          libsdl1.2-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          libtiff5-dev libx11-6 libx11-dev fluid-soundfont-gm timgm6mb-soundfont \
          xfonts-base xfonts-100dpi xfonts-75dpi xfonts-cyrillic fontconfig fonts-freefont-ttf libfreetype6-dev --fix-missing
          
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint --unsafe-load-any-extension y -E $(git ls-files '*.py')
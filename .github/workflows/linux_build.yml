name: Linux Build
run-name: ${{ github.actor }} is testing building for Linux
on: 
  pull_request:
    branches: [ "dev","main" ]
jobs:
  Linux-Build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install --fix-missing libsdl1.2-dev 
          sudo apt-get install git python3-dev python3-setuptools python3-numpy python3-opengl \
          libsdl-image1.2-dev libsdl-mixer1.2-dev libsdl-ttf2.0-dev libsmpeg-dev \
          libsdl1.2-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          libtiff5-dev libx11-6 libx11-dev fluid-soundfont-gm timgm6mb-soundfont \
          xfonts-base xfonts-100dpi xfonts-75dpi xfonts-cyrillic fontconfig fonts-freefont-ttf libfreetype6-dev --fix-missing

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller main.py

      - name: Check File Existence
        id: check_files
        uses: thebinaryfelix/check-file-existence-action@2.0.0
        with:
          files: 'dist/main/main, dist/main/_internal'
        
      - name: Files exist
        if: steps.check_files.outputs.exists == 'false'
        run: exit 1

      - run: echo "Job status ${{ job.status }}."
